name: pintar
description: Aplikasi Pembelajaran Bahasa AI - PINTAR
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.3.0
  flutter_riverpod: ^2.6.0
  google_fonts: ^6.2.0
  lottie: ^3.1.0
  glassmorphism: ^1.0.0
  flutter_tts: ^4.0.0
  speech_to_text: ^7.0.0
  http: ^1.2.0
  uuid: ^4.5.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
